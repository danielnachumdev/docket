name: docket

services:
  api:
    build:
      context: ./services/api
      args:
        # Optional: DOCKET_VERSION=0.2.11 docker compose build
        # Empty → API falls back to package __version__ (local dev).
        DOCKET_VERSION: ${DOCKET_VERSION:-}
    environment:
      DATABASE_URL: sqlite:////data/docket.db
      CORS_ORIGINS: http://127.0.0.1:8088,http://localhost:8088,http://127.0.0.1:5173,http://localhost:5173
      TOKEN_PEPPER: ${TOKEN_PEPPER:-dev-only-change-me}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret}
      DOCKET_VERSION: ${DOCKET_VERSION:-}
    volumes:
      - docket-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./services/web
    environment:
      API_UPSTREAM: api:8000
    ports:
      - "8088:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  docket-data:
