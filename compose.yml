name: docket

services:
  api:
    build:
      context: ./services/api
    environment:
      DATABASE_URL: sqlite:////data/docket.db
      CORS_ORIGINS: http://127.0.0.1:8088,http://localhost:8088
      TOKEN_PEPPER: ${TOKEN_PEPPER:-dev-only-change-me}
    volumes:
      - docket-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./services/web
    ports:
      - "8088:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  docket-data:
