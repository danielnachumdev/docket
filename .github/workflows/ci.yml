name: CI

# Thin orchestrator. Soft-protect with the check name this workflow reports (local aggregate → "CI"; see actions HOW-TO-USE → Required check names).
# Monorepo: Python and Node live under different services/, so we call the
# reusable lanes directly (umbrella detect uses one working-directory).
# Semver: require exactly one bump label on PRs; soft-protect "Semver / Semver".
# Prefer @latest (CD moves floating latest after each release).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  python:
    name: Python
    uses: danielnachumdev/actions/.github/workflows/python.yml@latest
    with:
      working-directory: services/api
      python-versions: '["3.12","3.13"]'
      sync-args: "--group dev"
      pytest-command: "pytest -q"

  node:
    name: Node
    uses: danielnachumdev/actions/.github/workflows/node.yml@latest
    with:
      working-directory: services/web
      node-versions: '["20","22"]'

  github-yaml:
    name: GitHub YAML
    uses: danielnachumdev/actions/.github/workflows/github-yaml.yml@latest

  rebase-guard:
    name: Rebase guard
    uses: danielnachumdev/actions/.github/workflows/rebase-guard.yml@latest
    with:
      alembic-root: services/api/alembic
      base-ref: origin/main

  semver:
    name: Semver
    if: github.event_name == 'pull_request'
    uses: danielnachumdev/actions/.github/workflows/semver-ci.yml@latest
    with:
      standards-ref: latest

  # Aggregate required check "CI" (local job name; soft protection + DAM gate).
  ci:
    name: CI
    needs: [python, node, github-yaml, rebase-guard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require sibling lanes
        run: |
          set -euo pipefail
          echo "python=${{ needs.python.result }}"
          echo "node=${{ needs.node.result }}"
          echo "github-yaml=${{ needs.github-yaml.result }}"
          echo "rebase-guard=${{ needs.rebase-guard.result }}"
          test "${{ needs.python.result }}" = "success"
          test "${{ needs.node.result }}" = "success"
          test "${{ needs.github-yaml.result }}" = "success"
          test "${{ needs.rebase-guard.result }}" = "success"

  # Opt-in Dependabot merge after aggregate CI + Semver (HOW-TO-USE.md).
  # Aggregate uses if: always() → DAM must continue with always() + result gate.
  dependabot-auto-merge:
    name: Merge Dependabot PR
    needs: [ci, semver]
    if: >-
      always() &&
      needs.ci.result == 'success' &&
      needs.semver.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: danielnachumdev/actions/.github/workflows/dependabot-auto-merge.yml@latest
