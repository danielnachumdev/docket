name: CD

# After successful CI on main (or manual dispatch):
#   1) Semver → bump / GitHub Release / optional floating retags (latest)
#   2) Build/push GHCR images for docket-deploy / Raft to pull
# No raft apply here — that lives in docket-deploy.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Semver: resolve bump only; do not create a Release"
        type: boolean
        default: true
      sha:
        description: "Commit SHA (empty = current GITHUB_SHA)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: read
  actions: read
  packages: write

concurrency:
  group: cd-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/danielnachumdev/docket-api
  WEB_IMAGE: ghcr.io/danielnachumdev/docket-web

jobs:
  changes:
    name: Resolve ref
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - name: Resolve deploy ref
        id: ref
        env:
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ github.event.inputs.sha }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            REF="${WR_SHA}"
          elif [ -n "${INPUT_SHA:-}" ]; then
            REF="${INPUT_SHA}"
          else
            REF="${FALLBACK_SHA}"
          fi
          if [ -z "${REF}" ]; then
            echo "::error::Could not resolve deploy ref/SHA."
            exit 1
          fi
          echo "sha=${REF}" >> "$GITHUB_OUTPUT"
          echo "Publishing for ${REF}"

  semver:
    name: Semver
    needs: changes
    uses: danielnachumdev/actions/.github/workflows/semver-cd.yml@latest
    with:
      standards-ref: latest
      dry-run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
      sha: ${{ needs.changes.outputs.sha }}
      python-version: "3.12"
      # Opt-in: force-move floating latest after each real release.
      retags: '["latest"]'
      # Monorepo package under services/api; stamp __version__ + wheel there.
      build-command: >-
        export PATH="${HOME}/.local/bin:${PATH}";
        bash scripts/release/build_release_wheel.sh "${TAG}" dist
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  build-push:
    name: Build and push GHCR images
    # After semver so release tag/version can be baked into the API image.
    needs: [changes, semver]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Bake rule (API DOCKET_VERSION):
      #   1) semver-cd `version` when a release/bump resolved a semver
      #   2) else semver-cd `tag` (strip leading v)
      #   3) else vX.Y.Z tag already pointing at this SHA
      #   4) else short SHA (noBump / non-release main push)
      - name: Resolve baked image version
        id: ver
        env:
          SEMVER_VERSION: ${{ needs.semver.outputs.version }}
          SEMVER_TAG: ${{ needs.semver.outputs.tag }}
          SHA: ${{ needs.changes.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${SEMVER_VERSION}" ]]; then
            VER="${SEMVER_VERSION}"
          elif [[ -n "${SEMVER_TAG}" ]]; then
            VER="${SEMVER_TAG#v}"
          else
            TAG="$(git tag --points-at "${SHA}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
            if [[ -n "${TAG}" ]]; then
              VER="${TAG#v}"
            else
              VER="$(printf '%s' "${SHA}" | cut -c1-7)"
            fi
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Baking DOCKET_VERSION=${VER}"

      - name: Push API image
        uses: docker/build-push-action@v7
        with:
          context: services/api
          file: services/api/Dockerfile
          push: true
          build-args: |
            DOCKET_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.API_IMAGE }}:${{ needs.changes.outputs.sha }}
            ${{ env.API_IMAGE }}:main
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=docket-api
          cache-to: type=gha,mode=max,scope=docket-api

      - name: Push web image
        uses: docker/build-push-action@v7
        with:
          context: services/web
          file: services/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ needs.changes.outputs.sha }}
            ${{ env.WEB_IMAGE }}:main
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=docket-web
          cache-to: type=gha,mode=max,scope=docket-web
