name: CD

# After successful CI on main (or manual dispatch), build/push GHCR images for
# docket-deploy / Raft to pull. No raft apply here — that lives in docket-deploy.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA (empty = current GITHUB_SHA)"
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: cd-ghcr-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/danielnachumdev/docket-api
  WEB_IMAGE: ghcr.io/danielnachumdev/docket-web

jobs:
  changes:
    name: Resolve ref
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - name: Resolve deploy ref
        id: ref
        env:
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ github.event.inputs.sha }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            REF="${WR_SHA}"
          elif [ -n "${INPUT_SHA:-}" ]; then
            REF="${INPUT_SHA}"
          else
            REF="${FALLBACK_SHA}"
          fi
          if [ -z "${REF}" ]; then
            echo "::error::Could not resolve deploy ref/SHA."
            exit 1
          fi
          echo "sha=${REF}" >> "$GITHUB_OUTPUT"
          echo "Publishing images for ${REF}"

  build-push:
    name: Build and push GHCR images
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push API image
        uses: docker/build-push-action@v7
        with:
          context: services/api
          file: services/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ needs.changes.outputs.sha }}
            ${{ env.API_IMAGE }}:main
          cache-from: type=gha,scope=docket-api
          cache-to: type=gha,mode=max,scope=docket-api

      - name: Push web image
        uses: docker/build-push-action@v7
        with:
          context: services/web
          file: services/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ needs.changes.outputs.sha }}
            ${{ env.WEB_IMAGE }}:main
          cache-from: type=gha,scope=docket-web
          cache-to: type=gha,mode=max,scope=docket-web
