# Copied from danielnachumdev/actions templates/github/dependabot.yml.
# noBump labels omitted: Semver is not adopted on this repo.
# Monorepo directories match services/ layout.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/services/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      pip-production:
        dependency-type: "production"
      pip-development:
        dependency-type: "development"

  - package-ecosystem: "npm"
    directory: "/services/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
