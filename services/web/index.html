<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0e12" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Docket — task system of record for people and agents." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Docket" />
    <title>Docket</title>
    <script>
      try {
        const saved = localStorage.getItem('docket.theme')
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        // Locale registry dirs live in src/i18n; only `en` (ltr) ships today.
        // When adding RTL locales, map code → dir here to avoid a flash.
        const locale = localStorage.getItem('docket.locale')
        const code = (locale || navigator.language || 'en').toLowerCase().split('-')[0]
        const dirs = { en: 'ltr' }
        if (dirs[code]) {
          document.documentElement.lang = code
          document.documentElement.dir = dirs[code]
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
